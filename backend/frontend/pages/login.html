<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — Deepak Interview Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-header-logo" aria-label="Deepak Interview Hub Home">
          <div class="navbar-logo-badge" style="width: 3rem; height: 3rem; font-size: 1.25rem;">D</div>
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to Deepak Interview Hub to track your interview prep progress</p>
      </div>

      <div id="auth-alert" class="alert alert-error" style="display: none;">
        <span class="alert-icon">✕</span>
        <div class="alert-content">
          <div class="alert-title">Login Failed</div>
          <div class="alert-message" id="auth-alert-msg">Invalid credentials.</div>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label form-label-required">Username or Email</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="e.g. rahul_cse" required autocomplete="username">
          <div class="form-error" id="username-error" style="display: none;"></div>
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="form-label form-label-required" style="margin-bottom: 0;">Password</label>
            <a href="#" class="text-xs text-gold-400" tabindex="-1">Forgot Password?</a>
          </div>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <div class="form-error" id="password-error" style="display: none;"></div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg mt-4">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/pages/register.html">Register free</a>
      </div>
    </div>
  </div>

  <script src="/js/api/client.js"></script>
  <script src="/js/utils/toast.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
